name: raft-local
services:
  postgres:
    image: postgres:16
    container_name: slock-dev-local-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: slock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private Postgres password}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["${RAFT_DATA_ROOT:?}/postgres:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slock"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["${RAFT_DATA_ROOT:?}/redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
  risingwave:
    image: risingwavelabs/risingwave:v2.8.0
    restart: unless-stopped
    ports: ["127.0.0.1:17666:4566", "127.0.0.1:17866:5691"]
    volumes: ["${RAFT_DATA_ROOT:?}/risingwave:/var/lib/risingwave"]
    command: ["single_node", "--store-directory", "/var/lib/risingwave", "--parallelism", "2", "--total-memory-bytes", "8589934592"]
    mem_limit: 10g
    stop_grace_period: 60s
